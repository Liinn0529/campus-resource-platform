spring:
  application:
    name: classroom-service
server:
  port: 8080
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  info:
    defaults:
      enabled: false
