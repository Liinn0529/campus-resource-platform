spring:
  application:
    name: reservation-service
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      connection-timeout: 5000
  flyway:
    url: ${spring.datasource.url}
    user: ${FLYWAY_USERNAME}
    password: ${FLYWAY_PASSWORD}
    default-schema: reservation
    schemas: [reservation]
    create-schemas: false
    clean-disabled: true
    validate-migration-naming: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
mybatis:
  configuration:
    map-underscore-to-camel-case: true
campus:
  platform:
    base-url: ${PLATFORM_BASE_URL}
    service-token: ${PLATFORM_RESERVATION_TOKEN}
  business-zone: ${CAMPUS_BUSINESS_ZONE}
  cors:
    origins: http://127.0.0.1:18080,http://localhost:18080,http://127.0.0.1:5173,http://localhost:5173
server:
  port: 8080
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  info:
    defaults:
      enabled: false
