spring:
  application:
    name: maintenance-service
  task:
    scheduling:
      pool:
        size: 2
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      connection-timeout: 5000
  flyway:
    url: ${spring.datasource.url}
    user: ${FLYWAY_USERNAME}
    password: ${FLYWAY_PASSWORD}
    default-schema: maintenance
    schemas: [maintenance]
    create-schemas: false
    clean-disabled: true
    validate-migration-naming: true
mybatis:
  configuration:
    map-underscore-to-camel-case: true
campus:
  platform:
    base-url: ${PLATFORM_BASE_URL}
    service-token: ${PLATFORM_MAINTENANCE_TOKEN}
  reservation:
    base-url: ${M1_BASE_URL}
    service-token: ${M1_MAINTENANCE_TOKEN}
  maintenance:
    repair-timeout-hours: ${MAINTENANCE_REPAIR_TIMEOUT_HOURS:24}
    scan-delay-ms: ${MAINTENANCE_SCAN_DELAY_MS:30000}
  cors:
    origins: http://127.0.0.1:18080,http://localhost:18080,http://127.0.0.1:5173,http://localhost:5173
server:
  port: 8080
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  info:
    defaults:
      enabled: false
