worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    # Exclude query strings and request bodies from local access logs.
    log_format safe '$remote_addr $request_method $uri $status $request_time';
    access_log /dev/stdout safe;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $uri $api_service {
        default platform-service:8080;
        ~^/api/v1/(reservation/|reservations(/|$)|violations$) reservation-service:8080;
    }

    server {
        listen 8080;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 'ok\n';
        }

        # Only this fixed set of read-only runtime endpoints is public locally.
        location ~ ^/status/(platform|reservation|classroom|maintenance)/(health|info)$ {
            if ($request_method != GET) { return 405; }
            set $upstream_service $1-service;
            set $runtime_endpoint $2;
            proxy_pass http://$upstream_service:8080/actuator/$runtime_endpoint;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
        }

        location ^~ /api/v1/ {
            proxy_pass http://$api_service;
            proxy_connect_timeout 2s;
            proxy_read_timeout 30s;
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Request-ID $request_id;
            client_max_body_size 64k;
        }

        location ~ ^/(internal|actuator|api|status)(/|$) { return 404; }

        location / {
            set $web_upstream web:8080;
            proxy_pass http://$web_upstream;
            proxy_set_header Host $host;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
        }
    }
}
