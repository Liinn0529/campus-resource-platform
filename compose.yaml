name: campus-resource-platform

x-backend: &backend
  restart: unless-stopped
  networks: [backend]
  mem_limit: 512m
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]

x-build: &backend-build
  context: .
  dockerfile: services/Dockerfile

x-build-args: &build-args
  GIT_COMMIT: ${GIT_COMMIT:-}
  BUILD_TIME: ${BUILD_TIME:-}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: campus_resource
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run ./scripts/init-env.sh first}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d campus_resource"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s

  platform-service:
    <<: *backend
    build:
      <<: *backend-build
      args:
        <<: *build-args
        SERVICE_NAME: platform-service
  reservation-service:
    <<: *backend
    build:
      <<: *backend-build
      args:
        <<: *build-args
        SERVICE_NAME: reservation-service
  classroom-service:
    <<: *backend
    build:
      <<: *backend-build
      args:
        <<: *build-args
        SERVICE_NAME: classroom-service
  maintenance-service:
    <<: *backend
    build:
      <<: *backend-build
      args:
        <<: *build-args
        SERVICE_NAME: maintenance-service

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    networks: [edge]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  nginx:
    image: nginx:stable-alpine
    user: nginx
    entrypoint: [nginx, -g, "daemon off;"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-18080}:8080"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks: [edge, backend]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    depends_on:
      platform-service: {condition: service_healthy}
      reservation-service: {condition: service_healthy}
      classroom-service: {condition: service_healthy}
      maintenance-service: {condition: service_healthy}
      web: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -Y, "off", -q, -O, /dev/null, "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

volumes:
  postgres-data:

networks:
  backend:
    internal: true
  edge:
