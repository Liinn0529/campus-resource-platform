name: campus-resource-platform

x-backend: &backend
  restart: unless-stopped
  networks: [backend]
  mem_limit: 512m
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  depends_on:
    postgres: {condition: service_healthy}

x-build: &backend-build
  context: .
  dockerfile: services/Dockerfile

x-build-args: &build-args
  GIT_COMMIT: ${GIT_COMMIT:-}
  BUILD_TIME: ${BUILD_TIME:-}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: campus_resource
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run ./scripts/init-env.sh first}
      PLATFORM_DB_PASSWORD: ${PLATFORM_DB_PASSWORD:?Run ./scripts/init-env.sh first}
      PLATFORM_FLYWAY_PASSWORD: ${PLATFORM_FLYWAY_PASSWORD:?Run ./scripts/init-env.sh first}
      RESERVATION_DB_PASSWORD: ${RESERVATION_DB_PASSWORD:?Run ./scripts/init-env.sh first}
      RESERVATION_FLYWAY_PASSWORD: ${RESERVATION_FLYWAY_PASSWORD:?Run ./scripts/init-env.sh first}
      CLASSROOM_DB_PASSWORD: ${CLASSROOM_DB_PASSWORD:?Run ./scripts/init-env.sh first}
      CLASSROOM_FLYWAY_PASSWORD: ${CLASSROOM_FLYWAY_PASSWORD:?Run ./scripts/init-env.sh first}
      MAINTENANCE_DB_PASSWORD: ${MAINTENANCE_DB_PASSWORD:?Run ./scripts/init-env.sh first}
      MAINTENANCE_FLYWAY_PASSWORD: ${MAINTENANCE_FLYWAY_PASSWORD:?Run ./scripts/init-env.sh first}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/postgres/010-service-databases.sh:/docker-entrypoint-initdb.d/010-service-databases.sh:ro
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d campus_resource"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s

  platform-service:
    <<: *backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/campus_resource?currentSchema=platform
      DB_USERNAME: platform_app
      DB_PASSWORD: ${PLATFORM_DB_PASSWORD:?Run ./scripts/init-env.sh first}
      FLYWAY_USERNAME: platform_migrator
      FLYWAY_PASSWORD: ${PLATFORM_FLYWAY_PASSWORD:?Run ./scripts/init-env.sh first}
      SPRING_PROFILES_ACTIVE: local
      CAMPUS_SEED_PASSWORD: ${DEV_SEED_PASSWORD:?Run ./scripts/init-env.sh first}
      PLATFORM_JWT_SECRET: ${PLATFORM_JWT_SECRET:?Run ./scripts/init-env.sh first}
      PLATFORM_RESERVATION_TOKEN: ${PLATFORM_RESERVATION_TOKEN:?Run ./scripts/init-env.sh first}
      PLATFORM_CLASSROOM_TOKEN: ${PLATFORM_CLASSROOM_TOKEN:?Run ./scripts/init-env.sh first}
      PLATFORM_MAINTENANCE_TOKEN: ${PLATFORM_MAINTENANCE_TOKEN:?Run ./scripts/init-env.sh first}
      CAMPUS_BUSINESS_ZONE: ${CAMPUS_BUSINESS_ZONE:?Run ./scripts/init-env.sh first}
    build:
      <<: *backend-build
      args:
        <<: *build-args
        SERVICE_NAME: platform-service
  reservation-service:
    <<: *backend
    depends_on:
      postgres: {condition: service_healthy}
      platform-service: {condition: service_healthy}
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/campus_resource?currentSchema=reservation
      DB_USERNAME: reservation_app
      DB_PASSWORD: ${RESERVATION_DB_PASSWORD:?Run ./scripts/init-env.sh first}
      FLYWAY_USERNAME: reservation_migrator
      FLYWAY_PASSWORD: ${RESERVATION_FLYWAY_PASSWORD:?Run ./scripts/init-env.sh first}
      PLATFORM_BASE_URL: http://platform-service:8080
      PLATFORM_RESERVATION_TOKEN: ${PLATFORM_RESERVATION_TOKEN:?Run ./scripts/init-env.sh first}
      CAMPUS_BUSINESS_ZONE: ${CAMPUS_BUSINESS_ZONE:?Run ./scripts/init-env.sh first}
      M1_CLASSROOM_TOKEN: ${M1_CLASSROOM_TOKEN:?Run ./scripts/init-env.sh first}
      M1_MAINTENANCE_TOKEN: ${M1_MAINTENANCE_TOKEN:?Run ./scripts/init-env.sh first}
      M1_COMPLETION_ENABLED: ${M1_COMPLETION_ENABLED:-false}
      M1_AUDIT_DISPATCH_ENABLED: ${M1_AUDIT_DISPATCH_ENABLED:-false}
    build:
      <<: *backend-build
      args:
        <<: *build-args
        SERVICE_NAME: reservation-service
  classroom-service:
    <<: *backend
    depends_on:
      postgres: {condition: service_healthy}
      platform-service: {condition: service_healthy}
      reservation-service: {condition: service_healthy}
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/campus_resource?currentSchema=classroom
      DB_USERNAME: classroom_app
      DB_PASSWORD: ${CLASSROOM_DB_PASSWORD:?Run ./scripts/init-env.sh first}
      FLYWAY_USERNAME: classroom_migrator
      FLYWAY_PASSWORD: ${CLASSROOM_FLYWAY_PASSWORD:?Run ./scripts/init-env.sh first}
      PLATFORM_BASE_URL: http://platform-service:8080
      PLATFORM_CLASSROOM_TOKEN: ${PLATFORM_CLASSROOM_TOKEN:?Run ./scripts/init-env.sh first}
      M1_BASE_URL: http://reservation-service:8080
      M1_CLASSROOM_TOKEN: ${M1_CLASSROOM_TOKEN:?Run ./scripts/init-env.sh first}
    build:
      <<: *backend-build
      args:
        <<: *build-args
        SERVICE_NAME: classroom-service
  maintenance-service:
    <<: *backend
    depends_on:
      postgres: {condition: service_healthy}
      platform-service: {condition: service_healthy}
      reservation-service: {condition: service_healthy}
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/campus_resource?currentSchema=maintenance
      DB_USERNAME: maintenance_app
      DB_PASSWORD: ${MAINTENANCE_DB_PASSWORD:?Run ./scripts/init-env.sh first}
      FLYWAY_USERNAME: maintenance_migrator
      FLYWAY_PASSWORD: ${MAINTENANCE_FLYWAY_PASSWORD:?Run ./scripts/init-env.sh first}
      PLATFORM_BASE_URL: http://platform-service:8080
      PLATFORM_MAINTENANCE_TOKEN: ${PLATFORM_MAINTENANCE_TOKEN:?Run ./scripts/init-env.sh first}
      M1_BASE_URL: http://reservation-service:8080
      M1_MAINTENANCE_TOKEN: ${M1_MAINTENANCE_TOKEN:?Run ./scripts/init-env.sh first}
    build:
      <<: *backend-build
      args:
        <<: *build-args
        SERVICE_NAME: maintenance-service

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    networks: [edge]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  nginx:
    image: nginx:stable-alpine
    user: nginx
    entrypoint: [nginx, -g, "daemon off;"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-18080}:8080"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks: [edge, backend]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    depends_on:
      platform-service: {condition: service_healthy}
      reservation-service: {condition: service_healthy}
      classroom-service: {condition: service_healthy}
      maintenance-service: {condition: service_healthy}
      web: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -Y, "off", -q, -O, /dev/null, "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

volumes:
  postgres-data:

networks:
  backend:
    internal: true
  edge:
